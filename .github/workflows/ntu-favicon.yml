name: Refresh official NTU favicon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch-ntu-favicon.py
      - .github/workflows/ntu-favicon.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original favicon from NTU over verified HTTPS
        run: python3 scripts/fetch-ntu-favicon.py
      - name: Save the verified source asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/ntu-emblem.* docs/ntu-emblem-source.json
          if ! git diff --cached --quiet; then
            git commit -m "Add original NTU favicon from the university website"
            git push origin HEAD:main
          fi
