name: Check publication resource links
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publication-links.yml
      - scripts/check-publication-links.py
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-publication-links.py
      - name: Save link-check evidence
        if: always()
        run: |
          if test -f docs/publication-link-check.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/publication-link-check.json
            if ! git diff --cached --quiet; then
              git commit -m "Record publication resource link checks"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
