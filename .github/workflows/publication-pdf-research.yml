name: Research publication PDF sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publication-pdf-research.yml
      - scripts/research-publication-pdfs.py
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pypdf playwright
      - run: python scripts/research-publication-pdfs.py
      - name: Save source research for review
        if: always()
        run: |
          if test -f docs/publication-pdf-research.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/publication-pdf-research.json
            if ! git diff --cached --quiet; then
              git commit -m "Record publication PDF source research"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
